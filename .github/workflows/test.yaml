name: Test

on:
  push:
    branches: [main, master]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@v7

      - name: Check Nuntio fork invariants
        run: npm run check:fork

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run lint
        run: npm run lint:check

      - name: Run Typecheck
        run: npm run typecheck

  # The spec suite opens a real Electron window and needs the sync engine, because
  # the mail database schema is created by mailsync's `migrate` mode. Nuntio targets
  # Windows and only publishes a Windows engine build, so the tests run there.
  tests:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Fetch sync engine
        run: npm run fetch-mailsync

      - name: Run tests
        run: npm test -- --junit-xml=tmp-junit
        timeout-minutes: 25

      # The console reporter's output is too noisy to read from a log, so the
      # JUnit XML is the artifact to look at when this job fails.
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: junit-results
          path: tmp-junit
          if-no-files-found: ignore
